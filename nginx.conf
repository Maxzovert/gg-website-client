server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Typo and legacy path redirects (HTTP 301). Host http→https www is one hop at the edge.
    rewrite ^/karungli$ /product/karungli-mala permanent;
    rewrite ^/karungli-mala$ /product/karungli-mala permanent;
    rewrite ^/karungali$ /product/karungli-mala permanent;
    rewrite ^/karungali-mala$ /product/karungli-mala permanent;
    rewrite ^/rudaksha$ /rudraksha permanent;
    rewrite ^/rudraksh$ /rudraksha permanent;
    rewrite ^/sprays/amrat-dhara$ /sprays/amrat-bindu permanent;
    rewrite ^/signup$ /login permanent;
    rewrite ^/auth$ /login permanent;

    location = /sitemap.xml {
        proxy_pass http://api:5000/api/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 502 503 504 =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|webp|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
